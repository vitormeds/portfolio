<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitor Mendes | Portfólio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            min-height: 100vh;
        }

        .hero-greeting {
            color: #64ffda;
            font-size: 1rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ccd6f6;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #495670;
            font-size: 0.85rem;
            border-top: 1px solid #1a1a1a;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <span class="hero-greeting">Olá, meu nome é</span>
        <h1>Vitor Mendes.</h1>

    </section>

    <footer>
        <p>&copy; 2026 Vitor Mendes. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
